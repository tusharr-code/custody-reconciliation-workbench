services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: custody_recon
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon_dev_only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d custody_recon"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recon:recon_dev_only@db:5432/custody_recon
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
